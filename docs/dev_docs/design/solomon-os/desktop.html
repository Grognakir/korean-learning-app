<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solomon OS</title>
<style>
  :root {
    --bg: #0d1410; --panel: #0a0f0c; --win: #101a14; --win2: #0e1712; --line: #1d3326; --line2: #16261c;
    --bright: #00ff66; --mid: #0fbf4f; --green: #22a354; --ink: #04150a; --text: #c9f7d8; --soft: #8fbfa0;
    --amber: #e0a23a;
    --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cell-w: 92px; --cell-h: 96px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .kr { word-break: keep-all; }
  button { font: inherit; color: inherit; }

  .os { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* ---------- верхняя панель (Xfce) ---------- */
  .panel { position: relative; z-index: 1000; flex: none; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px;
    background: var(--panel); border-bottom: 1px solid var(--line2); font-size: 12.5px; color: var(--soft); }
  .panel .logo { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 5px; color: var(--text); font-weight: 600; white-space: nowrap; }
  .panel .logo svg { width: 16px; height: 16px; color: var(--mid); }
  .tasks { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tasks::-webkit-scrollbar { display: none; }
  .task { display: flex; align-items: center; gap: 6px; max-width: 170px; padding: 4px 10px; border: 1px solid transparent; border-radius: 5px;
    background: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--soft); font-size: 12.5px; }
  .task svg { width: 14px; height: 14px; flex: none; fill: var(--mid); color: var(--ink); }
  .task.active { background: #14241a; border-color: var(--line); color: var(--text); }
  .task.min { opacity: .6; }
  .panel .tray { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .sig { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; } .sig i { width: 3px; background: var(--mid); }
  .bat { width: 22px; height: 11px; border: 1px solid var(--soft); padding: 1px; border-radius: 2px; } .bat i { display: block; height: 100%; width: 80%; background: var(--mid); }

  /* ---------- рабочий стол и сетка ---------- */
  .desk { position: relative; flex: 1; min-height: 0; overflow: hidden;
    background: radial-gradient(ellipse at 70% 40%, rgba(34,163,84,.10), transparent 60%), var(--bg); }
  .seal { position: absolute; right: 6%; bottom: 8%; width: min(38vw, 360px); aspect-ratio: 1; color: var(--mid); opacity: .07; pointer-events: none; }
  .seal svg { width: 100%; height: 100%; }
  .grid-hint { position: absolute; pointer-events: none; border: 1px dashed var(--mid); border-radius: 8px; background: rgba(34,163,84,.08); display: none; }
  .icon { position: absolute; width: var(--cell-w); height: var(--cell-h); display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding-top: 8px; border-radius: 8px; border: 1px solid transparent; cursor: default; touch-action: none; transition: left .12s, top .12s; }
  .icon.dragging { transition: none; z-index: 999; opacity: .85; }
  .icon.sel { background: rgba(34,163,84,.14); border-color: rgba(34,163,84,.35); }
  .icon .pic { position: relative; width: 46px; height: 46px; }
  .icon svg { width: 46px; height: 46px; fill: var(--mid); color: var(--ink); }
  .icon span { font-size: 12px; color: var(--text); text-align: center; line-height: 1.2; padding: 1px 5px; border-radius: 4px; text-shadow: 0 1px 2px #000; }
  .icon.sel span { background: var(--green); color: var(--ink); text-shadow: none; }
  .icon.locked svg { fill: #2a3d30; }
  .icon .lock { position: absolute; right: -4px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #0a0f0c; border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 10px; }
  .icon .badge { position: absolute; right: -6px; top: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--amber);
    color: var(--ink); font: 700 11px/18px var(--sans); text-align: center; }

  /* ---------- окна ---------- */
  .win { position: absolute; display: flex; flex-direction: column; min-width: 300px; min-height: 220px; background: var(--win);
    border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 18px 50px rgba(0,0,0,.55); overflow: hidden; }
  .win.focus { border-color: #2c5a3c; box-shadow: 0 22px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(34,163,84,.2); }
  .win.max { border-radius: 0; border-width: 0; }
  .win.opening { animation: open .16s ease-out; }
  @keyframes open { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .win.closing { animation: close .14s ease-in forwards; }
  @keyframes close { to { opacity: 0; transform: scale(.94); } }
  .titlebar { flex: none; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); cursor: move; touch-action: none; }
  .win:not(.focus) .titlebar { color: var(--soft); }
  .titlebar svg.ic { width: 15px; height: 15px; fill: var(--mid); color: var(--ink); flex: none; }
  .titlebar .t { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebar .btns { display: flex; gap: 2px; }
  .titlebar .btns button { width: 28px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 4px; background: none; cursor: pointer; color: var(--soft); }
  .titlebar .btns button:hover { background: #1d3326; color: var(--text); }
  .titlebar .btns button.x:hover { background: #c23b34; color: #fff; }
  .titlebar .btns svg { width: 12px; height: 12px; }
  .content { flex: 1; min-height: 0; position: relative; }
  .resize { position: absolute; z-index: 2; touch-action: none; }
  .resize.r { top: 34px; right: -3px; width: 8px; bottom: 10px; cursor: ew-resize; }
  .resize.b { left: 10px; right: 10px; bottom: -3px; height: 8px; cursor: ns-resize; }
  .resize.l { top: 34px; left: -3px; width: 8px; bottom: 10px; cursor: ew-resize; }
  .resize.br { right: -2px; bottom: -2px; width: 16px; height: 16px; cursor: nwse-resize; }
  .resize.bl { left: -2px; bottom: -2px; width: 16px; height: 16px; cursor: nesw-resize; }
  .win.max .resize { display: none; }
  .shield { position: fixed; inset: 0; z-index: 2000; display: none; }

  /* ---------- мессенджер ---------- */
  .msgr { position: absolute; inset: 0; display: grid; grid-template-columns: 230px 1fr; }
  .list { border-right: 1px solid var(--line); background: var(--win2); overflow: auto; }
  .list h3 { margin: 0; padding: 12px 14px 8px; font-size: 14px; font-weight: 600; }
  .chatitem { display: flex; gap: 10px; align-items: center; padding: 9px 12px; cursor: pointer; }
  .chatitem.on { background: #14241a; }
  .chatitem.locked { opacity: .35; cursor: default; }
  .ava { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none; border: 1px solid var(--line); background: #000; }
  .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .holo { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(3.2) brightness(.95) contrast(1.05); }
  .chatitem .meta { flex: 1; min-width: 0; }
  .chatitem b { display: block; font-size: 14px; font-weight: 600; }
  .chatitem small { display: block; font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatitem .time { font-size: 11px; color: var(--soft); align-self: flex-start; }
  .chatitem .cnt { min-width: 18px; height: 18px; border-radius: 9px; background: var(--green); color: var(--ink); font: 700 11px/18px var(--sans); text-align: center; padding: 0 5px; }
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chathead { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .chathead .ava { width: 32px; height: 32px; }
  .chathead b { font-size: 15px; font-weight: 600; } .chathead small { display: block; font-size: 11px; color: var(--mid); }
  .ru { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--line); background: none; color: var(--soft); cursor: pointer; }
  .ru[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--ink); }
  .back { display: none; border: 0; background: none; color: var(--text); font-size: 20px; padding: 0 6px 0 0; cursor: pointer; }
  .msgs { flex: 1; min-height: 0; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 9px; -webkit-user-select: text; user-select: text; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.45; animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.in { align-self: flex-start; background: #14241a; color: #e0f8e8; border-bottom-left-radius: 4px; }
  .msg.out { align-self: flex-end; background: var(--green); color: var(--ink); border-bottom-right-radius: 4px; }
  .msg .tr { display: none; margin-top: 3px; font-size: 12.5px; line-height: 1.35; color: var(--soft); }
  .msg.out .tr { color: #0b3d1f; }
  .showru .msg .tr { display: block; }
  .msg .st { display: block; margin-top: 2px; font-size: 10.5px; opacity: .65; text-align: right; }
  .typing { align-self: flex-start; font-size: 12px; color: var(--soft); }
  .typing i { display: inline-block; width: 5px; height: 5px; margin-left: 3px; background: var(--mid); border-radius: 50%; animation: dot 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
  .replies { flex: none; padding: 10px 12px 12px; border-top: 1px solid var(--line); display: grid; gap: 7px; }
  .replies .lbl { font-size: 11px; color: var(--soft); }
  .reply { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; font-size: 15px; color: var(--text);
    background: #14241a; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
  .reply:hover { background: var(--green); border-color: var(--green); color: var(--ink); }
  .reply .tr { display: none; font-size: 12px; color: var(--soft); }
  .reply:hover .tr { color: #0b3d1f; }
  .showru .reply .tr { display: inline; }

  /* ---------- терминал ---------- */
  .term { position: absolute; inset: 0; padding: 10px 12px; overflow: auto; background: #070c09; font: 13.5px/1.5 var(--mono); color: var(--text);
    -webkit-user-select: text; user-select: text; }
  .term .p { color: var(--bright); } .term .dim { color: var(--soft); }
  .term .line { white-space: pre-wrap; word-break: break-all; }
  .term input { font: inherit; color: var(--text); background: none; border: 0; outline: 0; width: 60%; caret-color: var(--bright); }

  /* ---------- настройки / заглушка ---------- */
  .pad { position: absolute; inset: 0; padding: 18px; overflow: auto; font-size: 14px; line-height: 1.5; }
  .pad h4 { margin: 0 0 8px; font-size: 15px; }
  .pad .btn { margin-top: 10px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: #14241a; color: var(--text); cursor: pointer; }
  .pad .btn:hover { background: var(--green); color: var(--ink); border-color: var(--green); }
  .lockbox { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--soft); padding: 20px; }
  .lockbox b { display: block; font-size: 30px; margin-bottom: 6px; }

  /* ---------- уведомление ---------- */
  .toast { position: absolute; z-index: 1500; top: 10px; right: 10px; width: min(330px, calc(100% - 20px)); display: flex; gap: 10px; align-items: center;
    padding: 10px 12px; background: #101a14; border: 1px solid #2c5a3c; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.6);
    cursor: pointer; transform: translateY(-140%); transition: transform .3s ease; }
  .toast.show { transform: none; }
  .toast b { display: block; font-size: 13px; } .toast small { font-size: 13px; color: var(--soft); }

  /* ---------- телефон: окна всегда развёрнуты ---------- */
  @media (max-width: 760px) {
    :root { --cell-w: 84px; --cell-h: 92px; }
    .panel .logo span { display: none; }
    .msgr { grid-template-columns: 1fr; }
    .msgr .list { display: block; }
    .msgr .chat { display: none; }
    .msgr.in-chat .list { display: none; }
    .msgr.in-chat .chat { display: flex; }
    .back { display: block; }
    .titlebar .btns .mx { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

const APPS = [
  { id: "msg", ko: "메시지", icon: "i-msg", w: 760, h: 520 },
  { id: "term", ko: "터미널", icon: "i-term", w: 600, h: 380 },
  { id: "set", ko: "설정", icon: "i-set", w: 440, h: 320 },
  { id: "call", ko: "전화", icon: "i-call", locked: true },
  { id: "map", ko: "지도", icon: "i-map", locked: true },
  { id: "shop", ko: "쇼핑", icon: "i-shop", locked: true },
  { id: "bank", ko: "은행", icon: "i-bank", locked: true },
  { id: "cal", ko: "일정", icon: "i-cal", locked: true },
  { id: "photo", ko: "사진", icon: "i-photo", locked: true },
];
const $ = id => document.getElementById(id);
const desk = $("desk"), hint = $("hint");
const PHONE = () => matchMedia("(max-width: 760px)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem("solomon:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("solomon:" + k, JSON.stringify(v)); } catch (e) {} },
};

/* ================= сетка иконок ================= */
const PAD = 10;
function cell() { const cs = getComputedStyle(document.documentElement); return [parseFloat(cs.getPropertyValue("--cell-w")), parseFloat(cs.getPropertyValue("--cell-h"))]; }
function gridSize() { const [cw, ch] = cell(); return [Math.max(1, Math.floor((desk.clientWidth - PAD * 2) / cw)), Math.max(1, Math.floor((desk.clientHeight - PAD * 2) / ch))]; }
let pos = store.get("icons", null);
function defaultPos() { const [, rows] = gridSize(); const p = {}; APPS.forEach((a, i) => { p[a.id] = [Math.floor(i / rows), i % rows]; }); return p; }
function fitPositions() {
  // все иконки внутри сетки и без наложений (после смены размера окна браузера)
  const [cols, rows] = gridSize(); const used = new Set(); const out = {};
  const take = (c, r) => { used.add(c + ":" + r); return [c, r]; };
  APPS.forEach(a => {
    let [c, r] = (pos && pos[a.id]) || [0, 0];
    c = Math.min(Math.max(c, 0), cols - 1); r = Math.min(Math.max(r, 0), rows - 1);
    if (used.has(c + ":" + r)) {
      outer: for (let cc = 0; cc < cols; cc++) for (let rr = 0; rr < rows; rr++) if (!used.has(cc + ":" + rr)) { c = cc; r = rr; break outer; }
    }
    out[a.id] = take(c, r);
  });
  pos = out;
}
const icons = {};
function placeIcon(id) { const [cw, ch] = cell(); const [c, r] = pos[id]; icons[id].style.left = PAD + c * cw + "px"; icons[id].style.top = PAD + r * ch + "px"; }
function buildIcons() {
  APPS.forEach(a => {
    const el = document.createElement("div");
    el.className = "icon kr" + (a.locked ? " locked" : ""); el.dataset.id = a.id;
    el.innerHTML = `<div class="pic"><svg><use href="#${a.icon}"/></svg>${a.locked ? '<i class="lock">🔒</i>' : ""}${a.id === "msg" ? '<b class="badge" id="badge">1</b>' : ""}</div><span>${a.ko}</span>`;
    desk.appendChild(el); icons[a.id] = el; bindIcon(el, a);
  });
  if (!pos) pos = defaultPos();
  fitPositions(); APPS.forEach(a => placeIcon(a.id));
}
function select(id) { Object.values(icons).forEach(i => i.classList.toggle("sel", i.dataset.id === id)); }
function bindIcon(el, a) {
  let start = null, moved = false, ox = 0, oy = 0, lastTap = 0;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.stopPropagation(); select(a.id);
    const r = el.getBoundingClientRect(); start = [e.clientX, e.clientY]; ox = e.clientX - r.left; oy = e.clientY - r.top; moved = false;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (!start) return;
    if (!moved && Math.hypot(e.clientX - start[0], e.clientY - start[1]) < 6) return;
    moved = true; el.classList.add("dragging");
    const d = desk.getBoundingClientRect(); const x = e.clientX - d.left - ox, y = e.clientY - d.top - oy;
    el.style.left = x + "px"; el.style.top = y + "px";
    const [c, rr] = snap(x, y), [cw, ch] = cell();
    Object.assign(hint.style, { display: "block", left: PAD + c * cw + "px", top: PAD + rr * ch + "px", width: cw + "px", height: ch + "px" });
  });
  const end = e => {
    if (!start) return; start = null; hint.style.display = "none"; el.classList.remove("dragging");
    if (moved) {
      const d = desk.getBoundingClientRect(); const [c, r] = snap(e.clientX - d.left - ox, e.clientY - d.top - oy);
      const other = APPS.find(x => x.id !== a.id && pos[x.id][0] === c && pos[x.id][1] === r);
      if (other) { pos[other.id] = pos[a.id]; placeIcon(other.id); }   // занято — меняемся местами
      pos[a.id] = [c, r]; placeIcon(a.id); store.set("icons", pos);
    } else {
      // компьютер: двойной клик; телефон: одно касание
      const now = Date.now();
      if (PHONE() || e.pointerType === "touch" || now - lastTap < 400) openApp(a.id);
      lastTap = now;
    }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function snap(x, y) { const [cw, ch] = cell(), [cols, rows] = gridSize();
  return [Math.min(Math.max(Math.round((x - PAD) / cw), 0), cols - 1), Math.min(Math.max(Math.round((y - PAD) / ch), 0), rows - 1)]; }
desk.addEventListener("pointerdown", e => { if (e.target === desk || e.target.closest(".seal")) select(null); });

/* ================= окна ================= */
const wins = {}; let zTop = 10;
const geo = store.get("windows", {});
function deskRect() { return { w: desk.clientWidth, h: desk.clientHeight }; }
function clampGeo(g) {
  const { w, h } = deskRect();
  g.w = Math.min(Math.max(g.w, 300), w); g.h = Math.min(Math.max(g.h, 220), h);
  g.x = Math.min(Math.max(g.x, -g.w + 120), w - 120); g.y = Math.min(Math.max(g.y, 0), h - 34);   // окно нельзя потерять за краем
  return g;
}
function applyGeo(id) {
  const W = wins[id], el = W.el;
  if (W.max || PHONE()) Object.assign(el.style, { left: 0, top: 0, width: "100%", height: "100%" });
  else { const g = clampGeo(W.g); Object.assign(el.style, { left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px" }); }
  el.classList.toggle("max", W.max || PHONE());
  el.querySelector(".mx use").setAttribute("href", W.max ? "#b-res" : "#b-max");
}
function save() { const o = {}; Object.entries(wins).forEach(([id, W]) => { o[id] = { ...W.g, max: W.max }; }); Object.assign(geo, o); store.set("windows", geo); }
function focusWin(id) {
  Object.entries(wins).forEach(([k, W]) => W.el.classList.toggle("focus", k === id));
  if (id) wins[id].el.style.zIndex = ++zTop;
  renderTasks(id);
}
function openApp(id) {
  const a = APPS.find(x => x.id === id);
  if (id === "msg") $("toast").classList.remove("show");
  if (wins[id]) { const W = wins[id]; if (W.min) { W.min = false; W.el.style.display = ""; } focusWin(id); return; }
  const n = Object.keys(wins).length, { w, h } = deskRect();
  const saved = geo[id];
  const g = saved ? { x: saved.x, y: saved.y, w: saved.w, h: saved.h } : { w: a.w || 460, h: a.h || 320, x: 0, y: 0 };
  if (!saved) { g.x = Math.max(10, (w - g.w) / 2 + n * 26 - 40); g.y = Math.max(10, (h - g.h) / 2 + n * 22 - 30); }
  const el = document.createElement("section");
  el.className = "win opening";
  el.innerHTML = `<div class="titlebar"><svg class="ic"><use href="#${a.icon}"/></svg><span class="t kr">${a.ko}${a.id === "msg" ? " — 지아" : ""}</span>
    <span class="btns"><button class="mn" title="Свернуть"><svg><use href="#b-min"/></svg></button><button class="mx" title="Развернуть"><svg><use href="#b-max"/></svg></button><button class="x" title="Закрыть"><svg><use href="#b-x"/></svg></button></span></div>
    <div class="content"></div>
    <i class="resize r"></i><i class="resize b"></i><i class="resize l"></i><i class="resize br"></i><i class="resize bl"></i>`;
  desk.appendChild(el);
  const W = wins[id] = { el, g, max: !!(saved && saved.max), min: false, app: a };
  setTimeout(() => el.classList.remove("opening"), 200);
  applyGeo(id); focusWin(id); bindWin(id); fillApp(id, el.querySelector(".content"));
}
function closeApp(id) { const W = wins[id]; save(); W.el.classList.add("closing"); setTimeout(() => W.el.remove(), 140); delete wins[id]; focusWin(topmost()); }
function minimize(id) { const W = wins[id]; W.min = true; W.el.style.display = "none"; focusWin(topmost()); }
function toggleMax(id) { const W = wins[id]; W.max = !W.max; applyGeo(id); save(); }
function topmost() { let best = null, z = -1; Object.entries(wins).forEach(([k, W]) => { if (!W.min && +W.el.style.zIndex > z) { z = +W.el.style.zIndex; best = k; } }); return best; }
function renderTasks(active) {
  $("tasks").innerHTML = Object.entries(wins).map(([id, W]) =>
    `<button class="task kr${id === active ? " active" : ""}${W.min ? " min" : ""}" data-id="${id}"><svg><use href="#${W.app.icon}"/></svg>${W.app.ko}</button>`).join("");
}
$("tasks").addEventListener("click", e => {
  const b = e.target.closest("[data-id]"); if (!b) return; const id = b.dataset.id, W = wins[id];
  if (W.min) { W.min = false; W.el.style.display = ""; focusWin(id); }
  else if (W.el.classList.contains("focus")) minimize(id);
  else focusWin(id);
});
function drag(e, onMove, onEnd) {
  // общий перетаскиватель: «щит» поверх всего, чтобы курсор не терялся над содержимым окон
  const sh = $("shield"); sh.style.display = "block"; sh.style.cursor = getComputedStyle(e.target).cursor;
  const sx = e.clientX, sy = e.clientY;
  const mv = ev => onMove(ev.clientX - sx, ev.clientY - sy), up = () => { sh.style.display = "none";
    removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); onEnd && onEnd(); };
  addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);
}
function bindWin(id) {
  const W = wins[id], el = W.el, tb = el.querySelector(".titlebar");
  el.addEventListener("pointerdown", () => focusWin(id), true);
  el.querySelector(".mn").onclick = () => minimize(id);
  el.querySelector(".mx").onclick = () => toggleMax(id);
  el.querySelector(".x").onclick = () => closeApp(id);
  tb.addEventListener("dblclick", e => { if (!e.target.closest("button") && !PHONE()) toggleMax(id); });
  tb.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || PHONE() || e.button !== 0) return;
    e.preventDefault();
    let g0 = { ...W.g };
    if (W.max) {   // тянем развёрнутое окно — оно восстанавливается под курсором
      const r = desk.getBoundingClientRect(); W.max = false;
      g0.x = e.clientX - r.left - g0.w / 2; g0.y = 0; W.g = { ...g0 }; applyGeo(id);
    }
    drag(e, (dx, dy) => { W.g.x = g0.x + dx; W.g.y = g0.y + dy; applyGeo(id); }, save);
  });
  el.querySelectorAll(".resize").forEach(h => h.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation(); const g0 = { ...W.g }, k = h.className.split(" ")[1];
    drag(e, (dx, dy) => {
      if (k.includes("r")) W.g.w = g0.w + dx;
      if (k.includes("b")) W.g.h = g0.h + dy;
      if (k.includes("l")) { const w = Math.max(300, g0.w - dx); W.g.x = g0.x + (g0.w - w); W.g.w = w; }
      applyGeo(id);
    }, save);
  }));
}
addEventListener("resize", () => { fitPositions(); APPS.forEach(a => placeIcon(a.id)); Object.keys(wins).forEach(applyGeo); });

/* ================= приложения ================= */
function fillApp(id, box) {
  const a = APPS.find(x => x.id === id);
  if (a.locked) { box.innerHTML = `<div class="lockbox kr"><div><b>🔒</b>잠겨 있어요.<br><small>Откроется по сюжету.</small></div></div>`; return; }
  if (id === "msg") return messenger(box);
  if (id === "term") return terminal(box);
  if (id === "set") {
    box.innerHTML = `<div class="pad kr"><h4>설정</h4>Solomon OS v0.1 · макет<br><span style="color:var(--soft)">Расположение иконок и окон сохраняется в браузере.</span><br><button class="btn" id="reset">Сбросить расположение</button></div>`;
    box.querySelector("#reset").onclick = () => { store.set("icons", null); store.set("windows", {}); store.set("chat", null); location.reload(); };
  }
}

/* --- мессенджер: короткий тестовый сценарий (текст — заглушка до пролога) --- */
const SCRIPT = {
  start: { jia: [["안녕! 서울은 어때요?", "Привет! Как тебе Сеул?"], ["지금 뭐 해요?", "Что сейчас делаешь?"]],
    replies: [["한국어를 공부해요.", "Учу корейский.", "study"], ["집에 있어요.", "Я дома.", "home"], ["지금 가요!", "Уже иду!", "go"]] },
  study: { jia: [["와, 대단해요! 어려워요?", "Ого, круто! Сложно?"]], replies: [["네, 조금 어려워요.", "Да, немного сложно.", "end"], ["아니요, 재미있어요!", "Нет, интересно!", "end"]] },
  home: { jia: [["그럼 같이 쇼핑 갈래요?", "Тогда пойдём вместе по магазинам?"]], replies: [["좋아요!", "Давай!", "end"], ["미안해요, 피곤해요.", "Прости, я устал.", "end"]] },
  go: { jia: [["어디에 가요? ㅋㅋ", "Куда идёшь? Ха-ха"]], replies: [["지아 집에 가요!", "К тебе домой!", "end"], ["몰라요 ㅋㅋ", "Не знаю, ха-ха", "end"]] },
  end: { jia: [["ㅋㅋㅋ 알겠어요. 이따 봐요!", "Ха-ха, поняла. Увидимся!"]], replies: [] },
};
let chat = store.get("chat", null) || { node: "start", log: [], shown: false };
function messenger(box) {
  box.innerHTML = `<div class="msgr" id="msgr">
    <aside class="list kr"><h3>메시지</h3>
      <div class="chatitem on" id="ci"><div class="ava"><img class="holo" src="${AVA}" alt=""></div><div class="meta"><b>지아</b><small id="ciLast"></small></div><span class="time">15:20</span></div>
      <div class="chatitem locked"><div class="ava"></div><div class="meta"><b>???</b><small>🔒</small></div></div>
      <div class="chatitem locked"><div class="ava"></div><div class="meta"><b>???</b><small>🔒</small></div></div></aside>
    <div class="chat"><div class="chathead"><button class="back" id="back">‹</button><div class="ava"><img class="holo" src="${AVA}" alt=""></div><div><b class="kr">지아</b><small class="kr">● 온라인</small></div><button class="ru" id="ru" aria-pressed="false">RU</button></div>
      <div class="msgs kr" id="msgs"></div><div class="replies kr" id="replies"></div></div></div>`;
  const root = box.querySelector("#msgr"), msgs = box.querySelector("#msgs"), reps = box.querySelector("#replies");
  if (PHONE()) root.classList.add("in-chat");
  box.querySelector("#ci").onclick = () => root.classList.add("in-chat");
  box.querySelector("#back").onclick = () => root.classList.remove("in-chat");
  box.querySelector("#ru").onclick = e => { const on = root.classList.toggle("showru"); e.currentTarget.setAttribute("aria-pressed", on); };
  const add = (who, ko, ru) => { const d = document.createElement("div"); d.className = "msg " + who;
    d.innerHTML = `${ko}<span class="tr">${ru}</span><span class="st">${who === "out" ? "읽음 · " : ""}15:2${Math.min(9, msgs.children.length)}</span>`;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; box.querySelector("#ciLast").textContent = ko; };
  chat.log.forEach(([w, k, r]) => add(w, k, r));
  const showReplies = () => {
    const n = SCRIPT[chat.node];
    reps.innerHTML = n.replies.length ? `<span class="lbl">답장 선택</span>` + n.replies.map(([k, r, to], i) => `<button class="reply" data-i="${i}">${k}<span class="tr">${r}</span></button>`).join("")
      : `<span class="lbl">대화 끝 · <a href="#" id="again" style="color:var(--mid)">처음부터</a></span>`;
    const again = reps.querySelector("#again"); if (again) again.onclick = e => { e.preventDefault(); chat = { node: "start", log: [], shown: false }; store.set("chat", chat); messenger(box); };
  };
  const jiaSays = (lines, done) => {
    reps.innerHTML = ""; let i = 0;
    const next = () => {
      if (i >= lines.length) { store.set("chat", chat); return done(); }
      const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "지아 입력 중<i></i><i></i><i></i>"; msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight;
      setTimeout(() => { t.remove(); const [k, r] = lines[i++]; chat.log.push(["in", k, r]); add("in", k, r); next(); }, 900);
    };
    next();
  };
  reps.addEventListener("click", e => {
    const b = e.target.closest(".reply"); if (!b) return;
    const [k, r, to] = SCRIPT[chat.node].replies[+b.dataset.i];
    chat.log.push(["out", k, r]); add("out", k, r); chat.node = to; store.set("chat", chat);
    jiaSays(SCRIPT[to].jia, showReplies);
  });
  if (!chat.shown) { chat.shown = true; jiaSays(SCRIPT.start.jia, showReplies); } else showReplies();
  const b = $("badge"); if (b) b.remove();
}

/* --- терминал --- */
function terminal(box) {
  box.innerHTML = `<div class="term" id="term"></div>`;
  const t = box.querySelector("#term");
  const print = (s, cls = "") => { const d = document.createElement("div"); d.className = "line " + cls; d.textContent = s; t.insertBefore(d, t.lastElementChild); t.scrollTop = t.scrollHeight; };
  t.innerHTML = `<div class="line dim">Solomon OS 0.1 — 'help' 를 입력하세요</div><div class="line"><span class="p">solomon@seoul:~$ </span><input id="cmd" autocomplete="off" spellcheck="false"></div>`;
  const inp = t.querySelector("#cmd"); setTimeout(() => !PHONE() && inp.focus(), 50);
  t.addEventListener("click", () => inp.focus());
  const CMDS = {
    help: () => "help · whoami · date · ls · hello · clear",
    whoami: () => "solomon — 서울에 온 지 3일 (3 дня в Сеуле)",
    date: () => "2026년 10월 30일 목요일 · 오후 3:20",
    ls: () => "메시지/  터미널/  설정/  ???/",
    hello: () => "안녕하세요! 👋",
  };
  inp.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const v = inp.value.trim(); inp.value = ""; print("solomon@seoul:~$ " + v);
    if (!v) return;
    if (v === "clear") { [...t.querySelectorAll(".line")].slice(0, -1).forEach(n => n.remove()); return; }
    print(CMDS[v] ? CMDS[v]() : `${v}: 명령을 찾을 수 없어요 (команда не найдена)`, CMDS[v] ? "" : "dim");
  });
}

/* ================= старт ================= */
function tick() { const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
  $("clock").textContent = `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${m}`; }
tick(); setInterval(tick, 30000);
buildIcons();
if (!chat.shown) setTimeout(() => { const t = $("toast"); t.classList.add("show"); t.onclick = () => { t.classList.remove("show"); openApp("msg"); };
  setTimeout(() => t.classList.remove("show"), 6000); }, 1200);
</script>

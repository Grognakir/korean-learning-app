<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Примерочная</title>
<style>
  :root {
    --paper: #faf6ee; --paper-2: #f1ebdc; --ink: #1c1b19; --ink-soft: #57534a;
    --stone: #8a8478; --line: #ddd5c2; --red: #c23b34; --blue: #1f4e8c;
    --green: #4c7a5e; --amber: #b4802a;
    --card-shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px rgba(28,27,25,.08);
    --surface: #fff; --bad-line: #e6b3ae; --bad-bg: #fdf3f2; --good-line: #b5cfbe; --good-bg: #f2f8f4;
    --win-bg: #fdf6e6; --worn-bg: #eef3fa; --floor: #e9dfc8; --stage-top: #fdfaf3; --tile: #f6f1e6;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #1b1a18; --paper-2: #24221f; --ink: #ece7dc; --ink-soft: #b9b2a4; --stone: #8f897d; --line: #3a3732;
    --blue: #7ea6e0; --green: #6fa383; --surface: #26241f; --bad-line: #7a3b36; --bad-bg: #3a2422; --good-line: #3f6a50;
    --good-bg: #1f2f25; --win-bg: #3a3020; --worn-bg: #22304a; --floor: #3a352b; --stage-top: #2a2723; --tile: #f1ebdc; } }
  :root[data-theme="dark"] {
    --paper: #1b1a18; --paper-2: #24221f; --ink: #ece7dc; --ink-soft: #b9b2a4; --stone: #8f897d; --line: #3a3732;
    --blue: #7ea6e0; --green: #6fa383; --surface: #26241f; --bad-line: #7a3b36; --bad-bg: #3a2422; --good-line: #3f6a50;
    --good-bg: #1f2f25; --win-bg: #3a3020; --worn-bg: #22304a; --floor: #3a352b; --stage-top: #2a2723; --tile: #f1ebdc; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .kr { word-break: keep-all; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .top h1 { font-size: 20px; margin: 0; }
  .top h1 small { color: var(--stone); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .btn {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 12px; padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--stone); }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btns { display: flex; gap: 8px; }

  .ru { display: none; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  body.showRu .ru { display: block; }

  .situation {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .situation .intro { font-size: 17px; line-height: 1.5; }
  .reqs { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .reqs li { display: flex; gap: 8px; align-items: flex-start; font-size: 16px; }
  .reqs .mark {
    flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line);
    display: grid; place-items: center; font-size: 12px; color: #fff; margin-top: 2px; transition: .2s;
  }
  .reqs li.done .mark { background: var(--green); border-color: var(--green); }
  .reqs li.done .ko { color: var(--stone); text-decoration: line-through; text-decoration-color: var(--line); }

  .main { display: grid; grid-template-columns: 1fr 1.1fr; gap: 14px; align-items: start; }
  @media (max-width: 760px) { .main { grid-template-columns: 1fr; } }

  .stage {
    position: relative; border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(ellipse at 50% 95%, var(--floor) 0 22%, transparent 23%), linear-gradient(var(--stage-top), var(--paper-2));
    display: grid; place-items: end center; padding: 64px 12px 8px;
  }
  .figure { position: relative; height: min(60vh, 560px); width: calc(min(60vh, 560px) * 2 / 3); max-width: 100%; }
  .figure > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .idle { transform-origin: 50% 96%; animation: idle 4.2s ease-in-out infinite; }
  @keyframes idle {
    0%, 100% { transform: rotate(-.5deg) scaleY(1); }
    50% { transform: rotate(.5deg) scaleY(1.007); }
  }
  .bubble {
    position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 9px 12px; font-size: 15px; line-height: 1.4; box-shadow: var(--card-shadow);
    transition: opacity .2s, transform .2s;
  }
  .bubble.empty { opacity: 0; transform: translateY(-6px); }
  .bubble.bad { border-color: var(--bad-line); background: var(--bad-bg); }
  .bubble.good { border-color: var(--good-line); background: var(--good-bg); }
  .bubble.win { border-color: var(--amber); background: var(--win-bg); font-weight: 600; }

  .shop { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--card-shadow); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { font: inherit; color: var(--ink); border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 15px; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tab .ru { display: none; }
  body.showRu .tab .ru { display: inline; font-size: 12px; margin-left: 4px; color: inherit; opacity: .7; }

  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .item {
    position: relative; font: inherit; border: 1.5px solid var(--line); background: var(--tile); border-radius: 14px;
    aspect-ratio: 1; display: grid; place-items: center; cursor: pointer; padding: 10px; transition: .15s;
  }
  .item:hover { border-color: var(--stone); transform: translateY(-1px); }
  .item.worn { border-color: var(--blue); }
  .item.selected { box-shadow: 0 0 0 3px rgba(31,78,140,.3); }
  .item .icon { width: 100%; height: 100%; object-fit: contain; }
  .item .tag {
    position: absolute; top: 6px; right: 6px; font-size: 11px; background: var(--blue); color: #fff;
    border-radius: 999px; padding: 1px 7px;
  }

  .palette { border-top: 1px dashed var(--line); padding-top: 12px; }
  .palette.hidden { display: none; }
  .palette .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches.none { display: none; }
  .sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; transition: transform .12s; }
  .sw:hover { transform: scale(1.1); }
  .sw[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint { color: var(--stone); font-size: 13px; margin: 0; }

  /* смена одежды: старый цельный кадр плавно растворяется поверх нового — пустот не видно */
  #prev { opacity: 0; pointer-events: none; }
  #prev.fade { animation: fade .32s ease-out forwards; }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
  #prev.snap { animation: fade .06s .17s forwards; }
  .squash { animation: squash .45s ease-out; transform-origin: 50% 96%; }
  @keyframes squash { 0% { transform: none; } 35% { transform: scale(1.04, .95); } 65% { transform: scale(.98, 1.03); } 100% { transform: none; } }
  .shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-6px) rotate(-1deg); } 50% { transform: translateX(6px) rotate(1deg); } 80% { transform: translateX(-3px); } }
  .hop { animation: hop .32s ease-out; }
  @keyframes hop { 40% { transform: translateY(-6px); } }
  .jump { animation: jump .6s ease-out 2; }
  @keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-26px); } }
  /* Телефон: персонаж закреплён сверху, магазин прокручивается под ним */
  @media (max-width: 760px) {
    .wrap { padding: 10px 12px 24px; }
    .top { margin-bottom: 8px; }
    .top h1 { font-size: 17px; }
    .top h1 small { display: none; }
    .btn { padding: 6px 10px; font-size: 13px; }
    .situation { padding: 10px 12px; margin-bottom: 8px; }
    .situation .intro { font-size: 15px; }
    .reqs { margin-top: 6px; gap: 3px; }
    .reqs li { font-size: 14px; }
    .main { gap: 8px; }
    .stage { position: sticky; top: 0; z-index: 5; padding: 50px 8px 4px; border-radius: 0 0 16px 16px; }
    .figure { height: 34vh; width: calc(34vh * 2 / 3); }
    .bubble { font-size: 13px; padding: 6px 10px; top: 6px; left: 6px; right: 6px; }
    .items { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
    .item { padding: 6px; }
    .sw { width: 30px; height: 30px; }
    .swatches { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="kr">옷 가게 <small>Примерочная · макет</small></h1>
    <div class="btns">
      <button class="btn" id="ruToggle" aria-pressed="false">Перевод</button>
      <button class="btn" id="next">Другая ситуация</button>
    </div>
  </div>

  <section class="situation">
    <div class="intro kr" id="intro"></div>
    <div class="ru" id="introRu"></div>
    <ul class="reqs" id="reqs"></ul>
  </section>

  <div class="main">
    <div>
    <div class="stage">
      <div class="bubble empty" id="bubble"><div class="kr" id="bKo"></div><div class="ru" id="bRu"></div></div>
      <div id="react"><div id="squash">
        <div class="figure idle" id="figure">
          <canvas id="scene" width="512" height="768" aria-label="Персонаж"></canvas>
          <canvas id="prev" width="512" height="768" aria-hidden="true"></canvas>
          <div id="sparks" style="position:absolute;inset:0"></div>
        </div>
      </div></div>
    </div>
    </div>

    <div class="shop">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="items" id="items"></div>
      <div class="palette hidden" id="palette">
        <div class="head">
          <span class="kr" id="palTitle">색깔을 고르세요</span>
          <button class="btn kr" id="takeOff">벗기</button>
        </div>
        <div class="swatches" id="swatches"></div>
      </div>
      <p class="hint">Нажмите на вещь — персонаж её наденет. Нажмите ещё раз — откроется палитра.</p>
    </div>
  </div>
</div>

function loadPath(key, path) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = () => res(null);
    i.src = ASSETS[path] || path; IMG[key] = i;
  });
}
const load = name => loadPath(name, `img/${name}.webp`);
const loadIcon = name => loadPath("icon_" + name, `img/icons/${name}.webp`);
// маски видимости «нижний слой — верхняя вещь»: что остаётся видно от нижнего слоя,
// когда сверху надета вещь (замена, а не наложение)
// вещи с ручной обводкой: у них контур лежит отдельным слоем без перекраски
const LINES = ["pants", "shoes"];
const CLIPS = ["base__pants", "base__shoes", "base__shirt", "base__tie", "base__jacket",
  "pants__shirt", "pants__jacket", "shirt__tie", "shirt__jacket", "tie__jacket"];
const loadClip = name => loadPath("clip_" + name, `img/clip/${name}.webp`);
function applyClips(ctx, lower) {
  ctx.globalCompositeOperation = "destination-in";
  Object.keys(worn).forEach(upper => {
    const m = IMG[`clip_${lower}__${upper}`];
    if (m && m.width) ctx.drawImage(m, 0, 0, ctx.canvas.width, ctx.canvas.height);
  });
  ctx.globalCompositeOperation = "source-over";
}
// холсты переиспользуются: Safari ограничивает общую память на холсты
const POOL = {};
function poolCanvas(key, w, h) {
  let c = POOL[key];
  if (!c) { c = POOL[key] = document.createElement("canvas"); }
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } else c.getContext("2d").clearRect(0, 0, w, h);
  return c;
}
function tinted(id, color, icon) {
  const img = icon ? IMG['icon_' + id] : IMG[id];
  if (!img || !img.width) return poolCanvas("empty", 1, 1);
  const [sx, sy, sw, sh] = [0, 0, img.width, img.height];
  // иконки витрины вставляются в DOM, поэтому у каждой свой холст; слои персонажа — из пула
  const c = icon ? document.createElement("canvas") : poolCanvas("layer_" + id, sw, sh);
  if (icon) { c.width = sw; c.height = sh; }
  const x = c.getContext("2d");
  x.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  if (color) {
    x.globalCompositeOperation = "multiply"; x.fillStyle = COLORS[color].hex; x.fillRect(0, 0, sw, sh);
    x.globalCompositeOperation = "destination-in"; x.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    x.globalCompositeOperation = "source-over";
  }
  // контур вещи за краем перекрашиваемой области — как нарисован, без цвета
  const line = !icon && IMG[id + "_line"];
  if (line && line.width) x.drawImage(line, 0, 0, sw, sh);
  if (!icon) applyClips(x, id);
  return c;
}

let sitIndex = 0, sit, worn = {}, selected, tab = "top", won, faceTimer, face = "base";

// весь персонаж собирается в одну цельную картинку: тело, одежда снизу вверх, рука на поясе
function drawScene() {
  const x = $("scene").getContext("2d");
  x.clearRect(0, 0, 512, 768);
  const body = poolCanvas("body", 512, 768);
  const b = body.getContext("2d");
  if (IMG[face] && IMG[face].width) b.drawImage(IMG[face], 0, 0, 512, 768);
  applyClips(b, "base");
  x.drawImage(body, 0, 0);
  Object.keys(worn).sort((p, q) => ITEMS[p].order - ITEMS[q].order)
    .forEach(id => x.drawImage(tinted(id, worn[id]), 0, 0, 512, 768));
  if (IMG.hand_palm && IMG.hand_palm.width) x.drawImage(IMG.hand_palm, 0, 0, 512, 768);
}
const drawFace = drawScene;
function setFace(name, ms) {
  clearTimeout(faceTimer);
  face = name; drawFace();
  if (ms) faceTimer = setTimeout(() => { face = "base"; drawFace(); }, ms);
}
function blinkLoop() {
  setTimeout(() => {
    if (face === "base") { setFace("base_blink", 140); }
    blinkLoop();
  }, 2600 + Math.random() * 2600);
}

function start(i) {
  sitIndex = i; sit = SITUATIONS[i]; worn = {}; selected = null; won = false;
  $("intro").textContent = sit.ko; $("introRu").textContent = sit.ru;
  setFace("base"); say(null); drawLayers(); render();
}

const satisfied = r => r.item in worn && (r.color === null || worn[r.item] === r.color);

function render() {
  $("reqs").innerHTML = sit.reqs.map(r => `
    <li class="${satisfied(r) ? "done" : ""}"><span class="mark">✓</span>
      <span><span class="ko kr">${reqKo(r)}</span><span class="ru">Наденьте ${r.ru}</span></span></li>`).join("");

  $("tabs").innerHTML = TABS.map(t => `
    <button class="tab kr" role="tab" aria-selected="${t.id === tab}" data-tab="${t.id}">${t.ko}<span class="ru">${t.ru}</span></button>`).join("");

  const box = $("items"); box.innerHTML = "";
  Object.entries(ITEMS).filter(([, it]) => it.cat === tab).forEach(([id, it]) => {
    const b = document.createElement("button");
    b.className = `item ${id in worn ? "worn" : ""} ${selected === id ? "selected" : ""}`;
    b.dataset.item = id; b.setAttribute("aria-label", "вещь");
    // холст вставляется как есть: без toDataURL, который браузер может запретить
    const im = tinted(id, id in worn ? worn[id] : it.def, true);
    im.className = "icon";
    b.appendChild(im);
    if (id in worn) b.insertAdjacentHTML("beforeend", '<span class="tag">надето</span>');
    box.appendChild(b);
  });

  const pal = $("palette");
  pal.classList.toggle("hidden", !selected);
  if (selected) {
    const colorable = ITEMS[selected].def !== null;
    $("palTitle").textContent = colorable ? "색깔을 고르세요" : `${ITEMS[selected].ko}`;
    $("swatches").classList.toggle("none", !colorable);
    $("swatches").innerHTML = colorable ? Object.entries(COLORS).map(([id, c]) => `
      <button class="sw" data-color="${id}" aria-pressed="${worn[selected] === id}" style="background:${c.hex}" aria-label="цвет"></button>`).join("") : "";
  }
}

// смена одежды — «пружинка»: персонаж пружинисто приседает и выпрямляется уже в новой вещи;
// старый цельный кадр исчезает в момент приседания, пустот не видно
function playEffect() {
  const prev = $("prev"), sq = $("squash");
  prev.className = ""; sq.classList.remove("squash"); void prev.offsetWidth;
  prev.classList.add("snap"); sq.classList.add("squash");
}
function drawLayers(changedId) {
  // снимок прежнего кадра кладётся сверху, под ним уже готов новый кадр
  const px = $("prev").getContext("2d");
  px.clearRect(0, 0, 512, 768); px.drawImage($("scene"), 0, 0);
  drawScene();
  if (changedId) playEffect();
  else { $("prev").className = ""; }
}

function say(msg, kind) {
  $("bubble").className = "bubble " + (msg ? kind : "empty");
  $("bKo").textContent = msg ? msg.ko : "";
  $("bRu").textContent = msg ? msg.ru : "";
}

function react(cls) {
  const r = $("react");
  r.classList.remove("shake", "hop", "jump"); void r.offsetWidth; r.classList.add(cls);
}

function check(id) {
  const it = ITEMS[id];
  const req = sit.reqs.find(r => r.item === id);
  if (!req) {
    const other = sit.reqs.find(r => ITEMS[r.item].cat === it.cat && !satisfied(r));
    say(other
      ? { ko: `${subj(it.ko)} 아니라 ${reqKo(other)}.`, ru: `Это ${it.ruNom}, а нужно надеть ${other.ru}.` }
      : { ko: `${topic(it.ko)} 필요 없어요. 벗으세요.`, ru: `${it.ruNotNeeded}. Снимите.` }, "bad");
    react("shake"); setFace("base_oops", 1400);
  } else if (!satisfied(req)) {
    say({ ko: `${topic(it.ko)} 맞아요. 그런데 색깔이 달라요. ${reqKo(req)}.`,
          ru: `Вещь верная, но цвет не тот. Наденьте ${req.ru}.` }, "bad");
    react("shake"); setFace("base_oops", 1400);
  } else {
    say({ ko: `좋아요! ${req.color ? COLORS[req.color].ko + " " : ""}${obj(it.ko)} ${it.past}.`, ru: `Отлично! Вы надели ${req.ru}.` }, "good");
    react("hop"); setFace("base_happy", 1200);
  }
  checkWin();
}

function checkWin() {
  const extra = Object.keys(worn).some(id => !sit.reqs.find(r => r.item === id));
  if (!won && !extra && sit.reqs.every(satisfied)) {
    won = true; say(sit.win, "win"); react("jump"); setFace("base_happy");
  }
}

$("tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (!t) return;
  tab = t.dataset.tab; render();
});
$("items").addEventListener("click", e => {
  const b = e.target.closest("[data-item]"); if (!b || won) return;
  const id = b.dataset.item;
  if (!(id in worn)) { worn[id] = ITEMS[id].def; selected = id; drawLayers(id); check(id); }
  else selected = selected === id ? null : id;
  render();
});
$("swatches").addEventListener("click", e => {
  const s = e.target.closest("[data-color]"); if (!s || !selected || won) return;
  worn[selected] = s.dataset.color; drawLayers(selected); check(selected); render();
});
$("takeOff").addEventListener("click", () => {
  if (!selected || won) return;
  const off = selected; delete worn[selected]; selected = null; drawLayers(off); say(null); render(); checkWin();
});
$("ruToggle").addEventListener("click", e => {
  const on = document.body.classList.toggle("showRu");
  e.currentTarget.setAttribute("aria-pressed", on);
});
$("next").addEventListener("click", () => start((sitIndex + 1) % SITUATIONS.length));

Promise.all([...FRAMES, "hand_palm", ...Object.keys(ITEMS), ...LINES.map(k => k + "_line")].map(load).concat(Object.keys(ITEMS).map(loadIcon), CLIPS.map(loadClip))).then(() => {
  start(0); blinkLoop();
});
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Примерочная — макет</title>
<style>
  :root {
    --paper: #faf6ee; --paper-2: #f1ebdc; --ink: #1c1b19; --ink-soft: #57534a;
    --stone: #8a8478; --line: #ddd5c2; --red: #c23b34; --blue: #1f4e8c;
    --green: #4c7a5e; --amber: #b4802a;
    --card-shadow: 0 1px 2px rgba(28,27,25,.06), 0 8px 24px rgba(28,27,25,.08);
    --fur: #e8a15c; --fur-light: #f7ddbb; --outline: #5b3a1e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .kr { word-break: keep-all; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .top h1 { font-size: 20px; margin: 0; }
  .top h1 small { color: var(--stone); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .btn {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--stone); }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btns { display: flex; gap: 8px; }

  .ru { display: none; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  body.showRu .ru { display: block; }

  .situation {
    background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--card-shadow);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .situation .intro { font-size: 17px; line-height: 1.5; }
  .reqs { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .reqs li { display: flex; gap: 8px; align-items: flex-start; font-size: 16px; }
  .reqs .mark {
    flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line);
    display: grid; place-items: center; font-size: 12px; color: #fff; margin-top: 2px; transition: .2s;
  }
  .reqs li.done .mark { background: var(--green); border-color: var(--green); }
  .reqs li.done .ko { color: var(--stone); text-decoration: line-through; text-decoration-color: var(--line); }

  .main { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; }
  @media (max-width: 720px) { .main { grid-template-columns: 1fr; } }

  .stage {
    position: relative; border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(ellipse at 50% 92%, #e9dfc8 0 26%, transparent 27%), linear-gradient(#fdfaf3, var(--paper-2));
    min-height: 420px; display: grid; place-items: end center; padding-top: 70px;
  }
  .stage svg.char { width: min(260px, 70%); height: auto; overflow: visible; }
  .bubble {
    position: absolute; top: 12px; left: 12px; right: 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 9px 12px; font-size: 15px; line-height: 1.4; box-shadow: var(--card-shadow);
    transition: opacity .2s, transform .2s;
  }
  .bubble.empty { opacity: 0; transform: translateY(-6px); }
  .bubble.bad { border-color: #e6b3ae; background: #fdf3f2; }
  .bubble.good { border-color: #b5cfbe; background: #f2f8f4; }
  .bubble.win { border-color: var(--amber); background: #fdf6e6; font-weight: 600; }

  .shop { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--card-shadow); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { font: inherit; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 15px; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tab .ru { display: none; }
  body.showRu .tab .ru { display: inline; font-size: 12px; margin-left: 4px; color: inherit; opacity: .7; }

  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .item {
    position: relative; font: inherit; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px;
    aspect-ratio: 1; display: grid; place-items: center; cursor: pointer; padding: 10px; transition: .15s;
  }
  .item:hover { border-color: var(--stone); transform: translateY(-1px); }
  .item.worn { border-color: var(--blue); background: #eef3fa; }
  .item.selected { box-shadow: 0 0 0 3px rgba(31,78,140,.25); }
  .item svg { width: 100%; height: 100%; }
  .item .tag {
    position: absolute; top: 6px; right: 6px; font-size: 11px; background: var(--blue); color: #fff;
    border-radius: 999px; padding: 1px 7px;
  }

  .palette { border-top: 1px dashed var(--line); padding-top: 12px; }
  .palette.hidden { display: none; }
  .palette .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer;
    transition: transform .12s;
  }
  .sw:hover { transform: scale(1.1); }
  .sw[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint { color: var(--stone); font-size: 13px; margin: 0; }

  /* --- анимации персонажа --- */
  .bob { animation: bob 3.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .tail { transform-box: view-box; transform-origin: 150px 228px; animation: tail 2.4s ease-in-out infinite alternate; }
  @keyframes tail { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
  .earR { transform-box: fill-box; transform-origin: 20% 100%; animation: ear 7s infinite; }
  @keyframes ear { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(14deg); } 94% { transform: rotate(0); } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .jump { animation: jump .7s ease-out 2; }
  @keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-22px); } }
  .mouthHappy { display: none; }
  .char.happy .mouthHappy { display: inline; }
  .char.happy .mouthIdle { display: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="kr">옷 가게 <small>Примерочная · макет</small></h1>
    <div class="btns">
      <button class="btn" id="ruToggle" aria-pressed="false">Перевод</button>
      <button class="btn" id="next">Другая ситуация</button>
    </div>
  </div>

  <section class="situation">
    <div class="intro kr" id="intro"></div>
    <div class="ru" id="introRu"></div>
    <ul class="reqs" id="reqs"></ul>
  </section>

  <div class="main">
    <div class="stage">
      <div class="bubble empty" id="bubble"><div class="kr" id="bKo"></div><div class="ru" id="bRu"></div></div>
      <svg class="char" id="char" viewBox="0 0 240 380" aria-label="Персонаж">
        <g id="body" class="bob">
          <!-- хвост -->
          <path class="tail" d="M148 226 Q206 220 202 172 Q198 142 214 128" fill="none" stroke="var(--outline)" stroke-width="18" stroke-linecap="round"/>
          <path class="tail" d="M148 226 Q206 220 202 172 Q198 142 214 128" fill="none" stroke="var(--fur)" stroke-width="13" stroke-linecap="round"/>
          <!-- ноги -->
          <g stroke-linecap="round">
            <line x1="101" y1="236" x2="100" y2="344" stroke="var(--outline)" stroke-width="31"/>
            <line x1="139" y1="236" x2="140" y2="344" stroke="var(--outline)" stroke-width="31"/>
            <line x1="101" y1="236" x2="100" y2="344" stroke="var(--fur)" stroke-width="27"/>
            <line x1="139" y1="236" x2="140" y2="344" stroke="var(--fur)" stroke-width="27"/>
          </g>
          <ellipse cx="95" cy="352" rx="19" ry="9" fill="var(--fur-light)" stroke="var(--outline)" stroke-width="2"/>
          <ellipse cx="145" cy="352" rx="19" ry="9" fill="var(--fur-light)" stroke="var(--outline)" stroke-width="2"/>
          <!-- руки -->
          <g stroke-linecap="round">
            <line x1="84" y1="142" x2="71" y2="236" stroke="var(--outline)" stroke-width="25"/>
            <line x1="156" y1="142" x2="169" y2="236" stroke="var(--outline)" stroke-width="25"/>
            <line x1="84" y1="142" x2="71" y2="236" stroke="var(--fur)" stroke-width="21"/>
            <line x1="156" y1="142" x2="169" y2="236" stroke="var(--fur)" stroke-width="21"/>
          </g>
          <circle cx="70" cy="244" r="11" fill="var(--fur-light)" stroke="var(--outline)" stroke-width="2"/>
          <circle cx="170" cy="244" r="11" fill="var(--fur-light)" stroke="var(--outline)" stroke-width="2"/>
          <!-- шея и туловище -->
          <rect x="110" y="110" width="20" height="26" fill="var(--fur)"/>
          <path d="M84 132 Q120 122 156 132 Q166 182 158 236 H82 Q74 182 84 132 Z" fill="var(--fur)" stroke="var(--outline)" stroke-width="2"/>
          <ellipse cx="120" cy="188" rx="22" ry="34" fill="var(--fur-light)"/>
          <!-- нижнее бельё -->
          <path d="M81 222 H159 L162 248 Q141 250 129 264 H111 Q99 250 78 248 Z" fill="#f4f1ea" stroke="var(--outline)" stroke-width="2"/>
          <rect x="81" y="222" width="78" height="6" fill="#7d9bd0"/>

          <!-- слои одежды -->
          <g id="layers"></g>

          <!-- голова -->
          <g id="head">
            <ellipse cx="120" cy="78" rx="45" ry="40" fill="var(--fur)" stroke="var(--outline)" stroke-width="2"/>
            <path d="M80 88 Q72 100 86 104 Q82 96 88 94 Z" fill="var(--fur-light)"/>
            <path d="M160 88 Q168 100 154 104 Q158 96 152 94 Z" fill="var(--fur-light)"/>
            <ellipse cx="120" cy="96" rx="17" ry="12" fill="var(--fur-light)"/>
            <g class="eyes">
              <ellipse cx="102" cy="78" rx="5.5" ry="7.5" fill="#2a1d12"/>
              <ellipse cx="138" cy="78" rx="5.5" ry="7.5" fill="#2a1d12"/>
              <circle cx="104" cy="75" r="2" fill="#fff"/>
              <circle cx="140" cy="75" r="2" fill="#fff"/>
            </g>
            <circle cx="92" cy="92" r="6" fill="#f08a8a" opacity=".35"/>
            <circle cx="148" cy="92" r="6" fill="#f08a8a" opacity=".35"/>
            <path d="M115 89 H125 L120 95 Z" fill="#7a3f2a"/>
            <path class="mouthIdle" d="M113 99 Q116.5 103 120 99 Q123.5 103 127 99" fill="none" stroke="var(--outline)" stroke-width="1.8" stroke-linecap="round"/>
            <path class="mouthHappy" d="M112 98 Q120 112 128 98 Z" fill="#a8463c" stroke="var(--outline)" stroke-width="1.6"/>
            <g stroke="var(--outline)" stroke-width="1.2" opacity=".55" stroke-linecap="round">
              <line x1="100" y1="96" x2="80" y2="93"/><line x1="100" y1="100" x2="81" y2="102"/>
              <line x1="140" y1="96" x2="160" y2="93"/><line x1="140" y1="100" x2="159" y2="102"/>
            </g>
          </g>
          <g id="hatLayer"></g>
          <!-- уши поверх шапки -->
          <g>
            <path d="M84 56 L88 20 L114 40" fill="var(--fur)" stroke="var(--outline)" stroke-width="2" stroke-linejoin="round"/>
            <path d="M92 46 L93 30 L106 40 Z" fill="#f5b9a6"/>
            <g class="earR">
              <path d="M156 56 L152 20 L126 40" fill="var(--fur)" stroke="var(--outline)" stroke-width="2" stroke-linejoin="round"/>
              <path d="M148 46 L147 30 L134 40 Z" fill="#f5b9a6"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div class="shop">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="items" id="items"></div>
      <div class="palette hidden" id="palette">
        <div class="head">
          <span><span class="kr">색깔을 고르세요</span><span class="ru" style="display:none" id="palRu"></span></span>
          <button class="btn kr" id="takeOff">벗기</button>
        </div>
        <div class="swatches" id="swatches"></div>
      </div>
      <p class="hint">Нажмите на вещь — персонаж её наденет. Нажмите ещё раз — откроется палитра.</p>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Все вещи нарисованы в координатах тела (viewBox 0 0 240 380): один и тот же
         рисунок служит слоем на персонаже и иконкой в магазине. Цвет — var(--c). -->
    <g id="g-pants">
      <path d="M79 216 H161 L162 350 H125 L121 262 H119 L115 350 H78 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M79 216 H161 V226 H79 Z" fill="rgba(0,0,0,.12)"/>
      <path d="M100 262 V340 M140 262 V340" stroke="rgba(0,0,0,.14)" stroke-width="2"/>
    </g>
    <g id="g-shirt">
      <g stroke-linecap="round">
        <line x1="84" y1="142" x2="72" y2="226" stroke="var(--outline)" stroke-width="31"/>
        <line x1="156" y1="142" x2="168" y2="226" stroke="var(--outline)" stroke-width="31"/>
        <line x1="84" y1="142" x2="72" y2="226" stroke="var(--c)" stroke-width="27"/>
        <line x1="156" y1="142" x2="168" y2="226" stroke="var(--c)" stroke-width="27"/>
      </g>
      <path d="M82 129 Q120 119 158 129 Q167 182 161 240 H79 Q73 182 82 129 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="2"/>
      <path d="M120 134 V238" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>
      <g fill="rgba(0,0,0,.28)"><circle cx="123" cy="152" r="2"/><circle cx="123" cy="172" r="2"/><circle cx="123" cy="192" r="2"/><circle cx="123" cy="212" r="2"/></g>
      <path d="M106 122 L120 138 L100 138 Z M134 122 L120 138 L140 138 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <g id="g-jacket">
      <g stroke-linecap="round">
        <line x1="84" y1="140" x2="71" y2="230" stroke="var(--outline)" stroke-width="36"/>
        <line x1="156" y1="140" x2="169" y2="230" stroke="var(--outline)" stroke-width="36"/>
        <line x1="84" y1="140" x2="71" y2="230" stroke="var(--c)" stroke-width="32"/>
        <line x1="156" y1="140" x2="169" y2="230" stroke="var(--c)" stroke-width="32"/>
      </g>
      <path d="M79 127 Q100 120 115 124 L111 252 H76 Q70 186 79 127 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="2"/>
      <path d="M161 127 Q140 120 125 124 L129 252 H164 Q170 186 161 127 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="2"/>
      <path d="M115 124 L101 128 L108 172 L114 156 Z M125 124 L139 128 L132 172 L126 156 Z" fill="rgba(0,0,0,.2)" stroke="var(--outline)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M86 214 H104 M136 214 H154" stroke="rgba(0,0,0,.3)" stroke-width="2"/>
      <g fill="rgba(0,0,0,.35)"><circle cx="133" cy="190" r="2.6"/><circle cx="133" cy="212" r="2.6"/></g>
    </g>
    <g id="g-cap">
      <path d="M78 64 Q80 24 120 24 Q160 24 162 64 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M120 24 V64" stroke="rgba(0,0,0,.15)" stroke-width="1.5"/>
      <path d="M78 62 Q120 54 168 62 Q182 70 166 74 Q120 66 78 70 Z" fill="var(--c)" stroke="var(--outline)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M78 62 Q120 54 168 62 Q182 70 166 74 Q120 66 78 70 Z" fill="rgba(0,0,0,.15)"/>
      <circle cx="120" cy="25" r="4" fill="var(--c)" stroke="var(--outline)" stroke-width="1.5"/>
    </g>
  </defs>
</svg>

<script>
const COLORS = {
  white:  { ko: "흰색",   hex: "#f7f6f1", ru: "белый" },
  black:  { ko: "까만색", hex: "#2e2d31", ru: "чёрный" },
  gray:   { ko: "회색",   hex: "#9b9a9f", ru: "серый" },
  red:    { ko: "빨간색", hex: "#d9443b", ru: "красный" },
  blue:   { ko: "파란색", hex: "#3f6fc6", ru: "синий" },
  yellow: { ko: "노란색", hex: "#f1c232", ru: "жёлтый" },
  green:  { ko: "초록색", hex: "#4f9a5a", ru: "зелёный" },
  pink:   { ko: "분홍색", hex: "#f29bb5", ru: "розовый" },
  brown:  { ko: "갈색",   hex: "#8b5a33", ru: "коричневый" },
};

// order — порядок слоёв на персонаже (меньше = ниже)
const ITEMS = {
  shirt:  { ko: "셔츠", cat: "top",  imp: "입으세요", past: "입었어요", ruNom: "рубашка", ruNotNeeded: "Рубашка не нужна", def: "pink",  order: 2, view: "58 112 124 140" },
  jacket: { ko: "재킷", cat: "top",  imp: "입으세요", past: "입었어요", ruNom: "пиджак",  ruNotNeeded: "Пиджак не нужен",  def: "brown", order: 3, view: "52 112 136 150" },
  pants:  { ko: "바지", cat: "bottom", imp: "입으세요", past: "입었어요", ruNom: "брюки", ruNotNeeded: "Брюки не нужны", def: "green", order: 1, view: "56 210 128 146" },
  cap:    { ko: "모자", cat: "acc",  imp: "쓰세요",  past: "썼어요",  ruNom: "кепка",  ruNotNeeded: "Кепка не нужна",   def: "red",   order: 4, view: "70 14 116 68" },
};

const TABS = [
  { id: "top", ko: "상의", ru: "верх" },
  { id: "bottom", ko: "하의", ru: "низ" },
  { id: "acc", ko: "액세서리", ru: "аксессуары" },
];

const SITUATIONS = [
  { ko: "어머! 속옷만 입고 있어요! 30분 후에 소풍을 가요. 빨리 옷을 사세요!",
    ru: "Ой! На вас только нижнее бельё! Через 30 минут пикник. Скорее купите одежду!",
    win: { ko: "완벽해요! 이제 소풍을 갈 수 있어요!", ru: "Идеально! Теперь можно идти на пикник!" },
    reqs: [ { item: "cap", color: "yellow", ru: "жёлтую кепку" },
            { item: "shirt", color: "white", ru: "белую рубашку" },
            { item: "pants", color: "blue", ru: "синие брюки" } ] },
  { ko: "큰일 났어요! 속옷만 입고 있어요! 한 시간 후에 면접이 있어요. 빨리 옷을 사세요!",
    ru: "Беда! На вас только нижнее бельё! Через час собеседование. Скорее купите одежду!",
    win: { ko: "완벽해요! 면접 잘 보세요!", ru: "Идеально! Удачи на собеседовании!" },
    reqs: [ { item: "shirt", color: "white", ru: "белую рубашку" },
            { item: "jacket", color: "black", ru: "чёрный пиджак" },
            { item: "pants", color: "gray", ru: "серые брюки" } ] },
  { ko: "어머나! 속옷만 입고 있어요! 오늘 저녁에 친구 생일 파티가 있어요. 빨리 옷을 사세요!",
    ru: "Ой-ой! На вас только нижнее бельё! Сегодня вечером день рождения друга. Скорее купите одежду!",
    win: { ko: "완벽해요! 파티에서 재미있게 노세요!", ru: "Идеально! Повеселитесь на вечеринке!" },
    reqs: [ { item: "shirt", color: "red", ru: "красную рубашку" },
            { item: "pants", color: "black", ru: "чёрные брюки" },
            { item: "cap", color: "green", ru: "зелёную кепку" } ] },
];

// частицы по 받침 последнего слога
const hasBatchim = w => (w.charCodeAt(w.length - 1) - 0xac00) % 28 !== 0;
const obj = w => w + (hasBatchim(w) ? "을" : "를");
const subj = w => w + (hasBatchim(w) ? "이" : "가");
const topic = w => w + (hasBatchim(w) ? "은" : "는");
const reqKo = r => `${COLORS[r.color].ko} ${obj(ITEMS[r.item].ko)} ${ITEMS[r.item].imp}`;

const $ = id => document.getElementById(id);
let sitIndex = 0, sit, worn, selected, tab = "top", won;

function start(i) {
  sitIndex = i; sit = SITUATIONS[i]; worn = {}; selected = null; won = false;
  $("intro").textContent = sit.ko; $("introRu").textContent = sit.ru;
  $("char").classList.remove("happy");
  say(null);
  render();
}

function satisfied(r) { return worn[r.item] === r.color; }

function render() {
  $("reqs").innerHTML = sit.reqs.map(r => `
    <li class="${satisfied(r) ? "done" : ""}"><span class="mark">✓</span>
      <span><span class="ko kr">${reqKo(r)}</span><span class="ru">Наденьте ${r.ru}</span></span></li>`).join("");

  $("tabs").innerHTML = TABS.map(t => `
    <button class="tab kr" role="tab" aria-selected="${t.id === tab}" data-tab="${t.id}">${t.ko}<span class="ru">${t.ru}</span></button>`).join("");

  $("items").innerHTML = Object.entries(ITEMS).filter(([, it]) => it.cat === tab).map(([id, it]) => `
    <button class="item ${worn[id] ? "worn" : ""} ${selected === id ? "selected" : ""}" data-item="${id}" aria-label="вещь">
      ${worn[id] ? '<span class="tag">надето</span>' : ""}
      <svg viewBox="${it.view}" style="--c:${COLORS[worn[id] || it.def].hex}"><use href="#g-${id}"/></svg>
    </button>`).join("");

  const pal = $("palette");
  pal.classList.toggle("hidden", !selected);
  if (selected) {
    $("swatches").innerHTML = Object.entries(COLORS).map(([id, c]) => `
      <button class="sw" data-color="${id}" aria-pressed="${worn[selected] === id}" style="background:${c.hex}" aria-label="цвет"></button>`).join("");
  }
}

function drawLayers(newId) {
  const ids = Object.keys(worn).sort((a, b) => ITEMS[a].order - ITEMS[b].order);
  $("layers").innerHTML = ids.filter(id => id !== "cap").map(id =>
    `<use href="#g-${id}" style="--c:${COLORS[worn[id]].hex}" class="${id === newId ? "pop" : ""}"/>`).join("");
  $("hatLayer").innerHTML = worn.cap ? `<use href="#g-cap" style="--c:${COLORS[worn.cap].hex}" class="${newId === "cap" ? "pop" : ""}"/>` : "";
}

function say(msg, kind) {
  const b = $("bubble");
  b.className = "bubble " + (msg ? kind : "empty");
  $("bKo").textContent = msg ? msg.ko : "";
  $("bRu").textContent = msg ? msg.ru : "";
}

function react(kind) {
  const c = $("char");
  c.classList.remove("shake", "jump");
  void c.offsetWidth;
  if (kind === "bad") c.classList.add("shake");
}

function check(id) {
  const it = ITEMS[id];
  const req = sit.reqs.find(r => r.item === id);
  if (!req) {
    const other = sit.reqs.find(r => ITEMS[r.item].cat === it.cat && !satisfied(r) && r.item !== id);
    if (other) {
      const o = ITEMS[other.item];
      say({ ko: `${subj(it.ko)} 아니라 ${reqKo(other)}.`, ru: `Это ${it.ruNom}, а нужно надеть ${other.ru}.` }, "bad");
    } else {
      say({ ko: `${topic(it.ko)} 필요 없어요. 벗으세요.`, ru: `${it.ruNotNeeded}. Снимите.` }, "bad");
    }
    react("bad");
  } else if (worn[id] !== req.color) {
    say({ ko: `${topic(it.ko)} 맞아요. 그런데 색깔이 달라요. ${reqKo(req)}.`,
          ru: `Вещь верная, но цвет не тот. Наденьте ${req.ru}.` }, "bad");
    react("bad");
  } else {
    say({ ko: `좋아요! ${COLORS[req.color].ko} ${obj(it.ko)} ${it.past}.`, ru: `Отлично! Вы надели ${req.ru}.` }, "good");
    react("good");
  }
  checkWin();
}

function checkWin() {
  const extra = Object.keys(worn).some(id => !sit.reqs.find(r => r.item === id));
  if (!won && !extra && sit.reqs.every(satisfied)) {
    won = true;
    say(sit.win, "win");
    const c = $("char");
    c.classList.add("happy");
    $("body").classList.remove("bob");
    $("body").classList.add("jump");
    setTimeout(() => { $("body").classList.remove("jump"); $("body").classList.add("bob"); }, 1500);
  }
}

$("tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (!t) return;
  tab = t.dataset.tab; render();
});

$("items").addEventListener("click", e => {
  const b = e.target.closest("[data-item]"); if (!b || won) return;
  const id = b.dataset.item;
  if (!worn[id]) {
    worn[id] = ITEMS[id].def; selected = id;
    drawLayers(id); check(id);
  } else {
    selected = selected === id ? null : id;
  }
  render();
});

$("swatches").addEventListener("click", e => {
  const s = e.target.closest("[data-color]"); if (!s || !selected || won) return;
  worn[selected] = s.dataset.color;
  drawLayers(selected); check(selected); render();
});

$("takeOff").addEventListener("click", () => {
  if (!selected || won) return;
  delete worn[selected]; selected = null;
  drawLayers(); say(null); render(); checkWin();
});

$("ruToggle").addEventListener("click", e => {
  const on = document.body.classList.toggle("showRu");
  e.currentTarget.setAttribute("aria-pressed", on);
});

$("next").addEventListener("click", () => { start((sitIndex + 1) % SITUATIONS.length); drawLayers(); });

start(0);
</script>
</body>
</html>
